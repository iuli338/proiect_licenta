<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dropwise — logo-ul site-ului: frunza pe disc verde -->
  <defs>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a8c5f"/>
      <stop offset="1" stop-color="#7dc99a"/>
    </linearGradient>
  </defs>

  <!-- Discul verde -->
  <circle cx="32" cy="32" r="32" fill="url(#disc)"/>

  <!-- Frunza stilizata — acelasi traseu ca logo-ul din navbar/topbar,
       scalat din viewBox 24 la 64 (factor ~2.13, translatat la centru) -->
  <g transform="translate(6.4 6.4) scale(2.13)" fill="none"
     stroke="#b8f0c9" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 20A7 7 0 0 1 4 13L4 5C4 4.4 4.4 4 5 4L13 4A7 7 0 0 1 20 11C20 16 16 20 11 20Z"/>
    <path d="M4 4 L20 20"/>
  </g>
</svg>
