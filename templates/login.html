<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dropwise — Autentificare</title>
  <meta name="description" content="Autentificare în dashboard-ul Dropwise." />
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}" />

  <link rel="stylesheet" href="{{ url_for('static', filename='global_styles.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}" />
</head>
<body class="page-login">

  <main class="login-card glass anim-rise">

    <!-- Brand -->
    <div class="login-card__brand">
      <span class="login-card__brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 4 13L4 5C4 4.4 4.4 4 5 4L13 4A7 7 0 0 1 20 11C20 16 16 20 11 20Z"/>
          <path d="M4 4 L20 20"/>
        </svg>
      </span>
      Dropwise
    </div>

    <!-- Titlu + lead -->
    <h1 class="login-card__title">Autentificare</h1>
    <p class="login-card__lead">
      Introdu credenţialele tipărite pe cutia hub-ului pentru a continua.
    </p>

    <!-- Mesaj de eroare (afișat doar dacă există) -->
    {% if error %}
      <div class="login-card__error" role="alert">
        {{ error }}
      </div>
    {% endif %}

    <!-- Formular -->
    <form class="login-form" method="POST" action="{{ url_for('login') }}" autocomplete="on">

      <div class="field">
        <label for="username" class="field__label">Utilizator</label>
        <input
          id="username"
          name="username"
          type="text"
          class="field__input"
          placeholder="admin"
          required
          autofocus
          autocomplete="username"
        />
      </div>

      <div class="field">
        <label for="password" class="field__label">Parolă</label>
        <input
          id="password"
          name="password"
          type="password"
          class="field__input"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn btn--primary btn--lg login-form__submit">
        Intră în dashboard
        <span class="btn__arrow" aria-hidden="true">→</span>
      </button>
    </form>

    <!-- Hint jos -->
    <div class="login-card__hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <line x1="12" y1="8"  x2="12" y2="12"/>
        <circle cx="12" cy="16" r="0.5" fill="currentColor"/>
      </svg>
      <span>
        Credenţialele sunt tipărite pe eticheta cutiei hub-ului. Pentru testare,
        utilizează <strong>admin</strong> / <strong>admin</strong>.
      </span>
    </div>

  </main>

</body>
</html>
