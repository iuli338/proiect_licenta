{# Buton comutator temă light/dark. Logica e în static/theme.js, care
   leagă orice element cu [data-theme-toggle]. Afişează soare pe dark
   (= treci pe light) şi lună pe light (= treci pe dark). #}
<button type="button" class="theme-toggle" data-theme-toggle
        aria-label="Comută tema" title="Comută tema">
  {# Soare — vizibil pe tema dark #}
  <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
  </svg>
  {# Lună — vizibilă pe tema light #}
  <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round"
       stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
</button>
