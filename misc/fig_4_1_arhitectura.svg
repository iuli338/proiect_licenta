<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 690"
     font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <style>
      .box   { fill:#fff; stroke:#000; stroke-width:1.5; }
      .grp   { fill:#f0f0f0; stroke:#000; stroke-width:1.5; }
      .sub   { fill:#fafafa; stroke:#000; stroke-width:1; }
      .acc   { fill:#e2e2e2; stroke:#000; stroke-width:1; }
      .t     { font-size:13.5px; fill:#000; }
      .tb    { font-size:15px; fill:#000; font-weight:700; }
      .ts    { font-size:13px; fill:#000; }
      .lab   { font-size:13px; fill:#000; font-style:italic; }
      .ln    { stroke:#000; stroke-width:1.6; fill:none; }
      .lnpow { stroke:#000; stroke-width:1.6; fill:none; stroke-dasharray:6 4; }
      .lnble { stroke:#000; stroke-width:1.4; fill:none; stroke-dasharray:2 3; }
      .lnwat { stroke:#000; stroke-width:2.2; fill:none; }
    </style>
  </defs>

  <text x="490" y="30" text-anchor="middle" font-size="17" font-weight="700">Arhitectura generală a sistemului</text>

  <!-- ===================== PC DASHBOARD (stanga-sus) ===================== -->
  <rect x="120" y="60" width="190" height="66" rx="6" class="grp"/>
  <text x="215" y="88" text-anchor="middle" class="tb">PC · Dashboard</text>
  <text x="215" y="107" text-anchor="middle" class="ts">aplicație Flask (browser)</text>

  <!-- ===================== ROUTER / TELEFON (dreapta-sus) ===================== -->
  <rect x="640" y="60" width="190" height="66" rx="6" class="grp"/>
  <text x="735" y="88" text-anchor="middle" class="tb">Router / telefon</text>
  <text x="735" y="107" text-anchor="middle" class="ts">rețea WiFi (hotspot)</text>

  <!-- ===================== NODURI (stanga, vertical, aliniate cu porturile) ===================== -->
  <!-- centre verticale: 250, 380, 510 -->
  <g>
    <rect x="40" y="206" width="150" height="92" rx="6" class="grp"/>
    <text x="115" y="228" text-anchor="middle" class="tb">Nod P1</text>
    <text x="115" y="250" text-anchor="middle" class="ts">SHT40 — aer (I²C)</text>
    <text x="115" y="269" text-anchor="middle" class="ts">senzor sol rezistiv</text>
    <text x="115" y="288" text-anchor="middle" class="ts">BH1750 — lux (I²C)</text>

    <rect x="40" y="336" width="150" height="92" rx="6" class="grp"/>
    <text x="115" y="358" text-anchor="middle" class="tb">Nod P2</text>
    <text x="115" y="380" text-anchor="middle" class="ts">SHT40 — aer (I²C)</text>
    <text x="115" y="399" text-anchor="middle" class="ts">senzor sol rezistiv</text>
    <text x="115" y="418" text-anchor="middle" class="ts">BH1750 — lux (I²C)</text>

    <rect x="40" y="466" width="150" height="92" rx="6" class="grp"/>
    <text x="115" y="488" text-anchor="middle" class="tb">Nod P3</text>
    <text x="115" y="510" text-anchor="middle" class="ts">SHT40 — aer (I²C)</text>
    <text x="115" y="529" text-anchor="middle" class="ts">senzor sol rezistiv</text>
    <text x="115" y="548" text-anchor="middle" class="ts">BH1750 — lux (I²C)</text>
  </g>

  <!-- ===================== HUB (dreapta-centru) ===================== -->
  <rect x="520" y="175" width="330" height="400" rx="6" class="grp"/>
  <text x="700" y="205" text-anchor="middle" class="tb">HUB central</text>

  <rect x="560" y="230" width="250" height="46" rx="4" class="sub"/>
  <text x="685" y="249" text-anchor="middle" class="tb">ESP32 DevKit</text>
  <text x="685" y="266" text-anchor="middle" class="ts">control · WiFi · BLE · ESP-NOW</text>

  <rect x="560" y="284" width="120" height="38" rx="4" class="sub"/>
  <text x="620" y="307" text-anchor="middle" class="t">OLED I²C</text>
  <rect x="690" y="284" width="120" height="38" rx="4" class="sub"/>
  <text x="750" y="307" text-anchor="middle" class="t">EEPROM</text>

  <rect x="560" y="330" width="120" height="44" rx="4" class="acc"/>
  <text x="620" y="354" text-anchor="middle" class="t">Pompă 5 V</text>
  <rect x="690" y="330" width="120" height="44" rx="4" class="acc"/>
  <text x="750" y="348" text-anchor="middle" class="t">3 valve</text>
  <text x="750" y="364" text-anchor="middle" class="ts">solenoidale</text>

  <text x="700" y="394" text-anchor="middle" class="ts">comutare prin MOSFET + optocuploare</text>

  <!-- Cele doua surse 5V/3A (incarcatoare) — linie logica + linie putere -->
  <rect x="560" y="408" width="120" height="44" rx="4" class="sub"/>
  <text x="620" y="427" text-anchor="middle" class="t">Sursă 5 V / 3 A</text>
  <text x="620" y="443" text-anchor="middle" class="ts">linia logică</text>
  <rect x="690" y="408" width="120" height="44" rx="4" class="sub"/>
  <text x="750" y="427" text-anchor="middle" class="t">Sursă 5 V / 3 A</text>
  <text x="750" y="443" text-anchor="middle" class="ts">linia de putere</text>

  <!-- 3 porturi pe latura STANGA, ALINIATE cu nodurile (y centre 250/380/510) -->
  <rect x="498" y="236" width="44" height="28" rx="3" class="box"/><text x="520" y="255" text-anchor="middle" class="t">P1</text>
  <rect x="498" y="366" width="44" height="28" rx="3" class="box"/><text x="520" y="385" text-anchor="middle" class="t">P2</text>
  <rect x="498" y="496" width="44" height="28" rx="3" class="box"/><text x="520" y="515" text-anchor="middle" class="t">P3</text>

  <!-- ===================== PRIZA 220V (dreapta-sus, deasupra rezervorului) ===================== -->
  <rect x="880" y="250" width="88" height="56" rx="3" class="acc"/>
  <text x="924" y="274" text-anchor="middle" class="t">Priză</text>
  <text x="924" y="291" text-anchor="middle" class="t">220 V c.a.</text>
  <!-- 220V -> hub (alimentare celor doua surse) -->
  <path class="lnpow" d="M880,278 L850,278" marker-end="url(#ar)"/>

  <!-- ===================== REZERVOR (dreapta-jos) ===================== -->
  <rect x="880" y="470" width="88" height="80" rx="3" class="grp"/>
  <text x="924" y="505" text-anchor="middle" class="t">Rezervor</text>
  <text x="924" y="522" text-anchor="middle" class="ts">apă</text>
  <!-- furtun rezervor -> hub (pompa) -->
  <path class="lnwat" d="M880,500 L850,500" marker-end="url(#ar)"/>

  <!-- ===================== LEGATURI fizice nod<->port (DREPTE orizontale) ===================== -->
  <!-- fiecare: apa (continuu, sus) + alimentare (punctat, jos) -->
  <!-- P1 (y 250) -->
  <path class="lnwat" d="M190,244 L498,244" marker-end="url(#ar)"/>
  <path class="lnpow" d="M190,256 L498,256" marker-end="url(#ar2)"/>
  <!-- P2 (y 380) -->
  <path class="lnwat" d="M190,374 L498,374" marker-end="url(#ar)"/>
  <path class="lnpow" d="M190,386 L498,386" marker-end="url(#ar2)"/>
  <!-- P3 (y 510) -->
  <path class="lnwat" d="M190,504 L498,504" marker-end="url(#ar)"/>
  <path class="lnpow" d="M190,516 L498,516" marker-end="url(#ar2)"/>

  <!-- ESP-NOW: noduri <-> hub (wireless) — arc INALT, intra in latura SUS a hubului -->
  <path class="ln" d="M150,200 C300,138 600,138 700,170" marker-end="url(#ar)" marker-start="url(#ar2)"/>
  <rect x="350" y="114" width="200" height="18" fill="#fff"/>
  <text x="450" y="128" text-anchor="middle" class="lab">ESP-NOW (noduri ↔ hub)</text>

  <!-- ===================== LEGATURI WiFi prin router ===================== -->
  <!-- hub -> router (sus dreapta) -->
  <path class="ln" d="M735,126 L735,175" marker-end="url(#ar)" marker-start="url(#ar2)"/>
  <text x="775" y="155" text-anchor="middle" class="lab">WiFi</text>
  <!-- router -> PC (sus, orizontal) -->
  <path class="ln" d="M640,93 L310,93" marker-end="url(#ar)" marker-start="url(#ar2)"/>
  <text x="475" y="85" text-anchor="middle" class="lab">WiFi (rețea locală)</text>
  <!-- BLE hub -> PC (configurare) — arc JOS, separat de ESP-NOW; pleaca din latura stanga a hubului, intra in PC -->
  <path class="lnble" d="M520,330 C360,300 280,250 245,128" marker-end="url(#ar)" marker-start="url(#ar2)"/>
  <rect x="300" y="206" width="150" height="17" fill="#fff"/>
  <text x="375" y="219" text-anchor="middle" class="ts">BLE (configurare iniţială)</text>

  <!-- ===================== LEGENDA (jos-stanga) ===================== -->
  <rect x="40" y="612" width="560" height="58" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
  <g transform="translate(0,2)">
  <line x1="54" y1="629" x2="90" y2="629" class="lnwat"/><text x="98" y="633" class="ts">apă (furtun + conector pneumatic)</text>
  <line x1="350" y1="629" x2="386" y2="629" class="lnpow"/><text x="394" y="633" class="ts">alimentare (Molex)</text>
  <line x1="54" y1="651" x2="90" y2="651" class="ln"/><text x="98" y="655" class="ts">date fără fir (ESP-NOW, WiFi)</text>
  <line x1="350" y1="651" x2="386" y2="651" class="lnble"/><text x="394" y="655" class="ts">BLE (credențiale)</text>
  </g>
</svg>
