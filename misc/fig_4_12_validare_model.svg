  <text x="52" y="518" class="tb" font-size="13">Cum se citește</text>
  <text x="52" y="540" class="ts">• Pe fiecare interval dintre udări, modelul de ordinul întâi (relaxare exponenţială cu constanta de timp τ) urmăreşte îndeaproape curba măsurată.</text>
  <text x="52" y="560" class="ts">• Suprapunerea celor două curbe confirmă că procesul simulat imită comportamentul real al solului (eroare medie pătratică ≈ 3% umiditate, τ ≈ 32 h).</text>
