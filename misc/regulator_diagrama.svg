<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280"
     font-family="serif" font-size="16">

  <!-- Marker săgeată -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>

  <!-- ============================================
       Bucla principală (de la stânga la dreapta)
       ============================================ -->

  <!-- 1. Etichetă referinţă r(t) -->
  <text x="15" y="115" text-anchor="start">r(t)</text>
  <text x="15" y="135" text-anchor="start" font-size="12" fill="#555">setpoint</text>

  <!-- Săgeată r(t) → sumator -->
  <line x1="55" y1="120" x2="155" y2="120" stroke="black" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <!-- 2. Sumator (cerc cu Σ şi semnele + / −) -->
  <circle cx="170" cy="120" r="18" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="170" y="126" text-anchor="middle" font-size="20">Σ</text>
  <text x="148" y="115" font-size="14">+</text>
  <text x="173" y="158" font-size="14">−</text>

  <!-- Eticheta e(t) între sumator şi PI -->
  <line x1="188" y1="120" x2="280" y2="120" stroke="black" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="225" y="110" text-anchor="middle" font-size="14" fill="#333">e(t)</text>

  <!-- 3. Bloc PI -->
  <rect x="295" y="95" width="100" height="50" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="345" y="120" text-anchor="middle">PI</text>
  <text x="345" y="138" text-anchor="middle" font-size="12" fill="#555">Kp, Ki</text>

  <!-- u(t) între PI şi proces -->
  <line x1="395" y1="120" x2="500" y2="120" stroke="black" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="447" y="110" text-anchor="middle" font-size="14" fill="#333">u(t)</text>
  <text x="447" y="142" text-anchor="middle" font-size="11" fill="#777">doză [ml]</text>

  <!-- 4. Bloc Proces sol -->
  <rect x="515" y="95" width="130" height="50" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="580" y="120" text-anchor="middle">Proces sol</text>
  <text x="580" y="138" text-anchor="middle" font-size="12" fill="#555">K, τ</text>

  <!-- y(t) iesire -->
  <line x1="645" y1="120" x2="780" y2="120" stroke="black" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="755" y="110" text-anchor="middle" font-size="14" fill="#333">y(t)</text>
  <text x="755" y="142" text-anchor="middle" font-size="11" fill="#777">umiditate</text>

  <!-- ============================================
       Ramura de feedback (jos)
       ============================================ -->

  <!-- Nodul de bifurcaţie (cerc mic plin pe linia y(t)) -->
  <circle cx="700" cy="120" r="3" fill="black"/>

  <!-- Coborâre y(t) -->
  <line x1="700" y1="120" x2="700" y2="220" stroke="black" stroke-width="1.5"/>

  <!-- Linie orizontală spre senzor -->
  <line x1="700" y1="220" x2="470" y2="220" stroke="black" stroke-width="1.5"/>

  <!-- 5. Bloc Senzor -->
  <rect x="370" y="195" width="100" height="50" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="420" y="225" text-anchor="middle">Senzor</text>

  <!-- y_măsurat de la senzor spre sumator -->
  <line x1="370" y1="220" x2="170" y2="220" stroke="black" stroke-width="1.5"/>
  <line x1="170" y1="220" x2="170" y2="138" stroke="black" stroke-width="1.5"
        marker-end="url(#arrow)"/>

</svg>
