<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1380"
     font-family="serif" font-size="14">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
    <style>
      .box-act    { fill: white; stroke: black; stroke-width: 1.5; }
      .box-stop   { fill: #f0f0f0; stroke: #666; stroke-width: 1.2; }
      .box-uda    { fill: #d8eedd; stroke: #2e7d4a; stroke-width: 1.8; }
      .label      { font-size: 14px; }
      .label-sym  { font-size: 15px; font-family: monospace; }
      .label-sub  { font-size: 11px; fill: #555; font-style: italic; }
      .label-no   { font-size: 12px; fill: #c0392b; font-weight: bold; }
      .label-yes  { font-size: 12px; fill: #2e7d4a; font-weight: bold; }
      .line       { stroke: black; stroke-width: 1.4; fill: none; }
      .line-stop  { stroke: #999; stroke-width: 1.2; fill: none;
                    stroke-dasharray: 4 3; }
    </style>
  </defs>

  <!-- Titlu -->
  <text x="425" y="28" text-anchor="middle" font-size="17" font-weight="bold">
    Schema de decizie pentru udarea automată
  </text>
  <text x="425" y="48" text-anchor="middle" font-size="12" fill="#555">
    Apelată la fiecare tick de regulator (10 min)
  </text>

  <!-- ============================================
       START
       ============================================ -->

  <ellipse cx="425" cy="90" rx="60" ry="20" class="box-act"/>
  <text x="425" y="95" text-anchor="middle" class="label">START tick</text>

  <line x1="425" y1="110" x2="425" y2="135" class="line" marker-end="url(#arrow)"/>

  <!-- ============================================
       1. Citire senzor + calcul timp
       ============================================ -->

  <rect x="280" y="135" width="290" height="55" rx="4" class="box-act"/>
  <text x="425" y="156" text-anchor="middle" class="label-sym">h = citire senzor</text>
  <text x="425" y="174" text-anchor="middle" class="label-sym">dt = timp de la ultima udare</text>

  <line x1="425" y1="190" x2="425" y2="215" class="line" marker-end="url(#arrow)"/>

  <!-- ============================================
       2. SAFETY MAX
       ============================================ -->

  <polygon points="425,215 660,278 425,340 190,278" class="box-act"/>
  <text x="425" y="265" text-anchor="middle" class="label-sym">dt ≥ safety_max ?</text>
  <text x="425" y="283" text-anchor="middle" class="label-sub">au trecut prea multe zile fără udare</text>
  <text x="425" y="300" text-anchor="middle" class="label-sub">(safety_max ≈ 1.2 × T_min)</text>

  <!-- NU → în jos -->
  <line x1="425" y1="340" x2="425" y2="375" class="line" marker-end="url(#arrow)"/>
  <text x="440" y="358" class="label-no">NU</text>

  <!-- DA → dreapta către "UDA forțat" -->
  <line x1="660" y1="278" x2="730" y2="278" class="line" marker-end="url(#arrow)"/>
  <text x="675" y="270" class="label-yes">DA</text>

  <rect x="730" y="250" width="110" height="55" rx="4" class="box-uda"/>
  <text x="785" y="272" text-anchor="middle" class="label" font-weight="bold">UDARE FORŢATĂ</text>
  <text x="785" y="290" text-anchor="middle" class="label-sub">cu target_dose_ml</text>

  <!-- ============================================
       3. ANTI-TWITCH
       ============================================ -->

  <polygon points="425,375 660,438 425,500 190,438" class="box-act"/>
  <text x="425" y="425" text-anchor="middle" class="label-sym">dt &lt; 6 h ?</text>
  <text x="425" y="443" text-anchor="middle" class="label-sub">am udat foarte recent</text>
  <text x="425" y="460" text-anchor="middle" class="label-sub">(anti-twitch, evită impulsuri)</text>

  <!-- DA → STOP -->
  <line x1="660" y1="438" x2="730" y2="438" class="line-stop" marker-end="url(#arrow)"/>
  <text x="675" y="430" class="label-yes">DA</text>

  <rect x="730" y="410" width="110" height="55" rx="4" class="box-stop"/>
  <text x="785" y="432" text-anchor="middle" class="label">NU UDA</text>
  <text x="785" y="450" text-anchor="middle" class="label-sub">cooldown activ</text>

  <!-- NU → în jos -->
  <line x1="425" y1="500" x2="425" y2="535" class="line" marker-end="url(#arrow)"/>
  <text x="440" y="518" class="label-no">NU</text>

  <!-- ============================================
       4. Acumulare integrală
       ============================================ -->

  <rect x="280" y="535" width="290" height="70" rx="4" class="box-act"/>
  <text x="425" y="556" text-anchor="middle" class="label-sym">e = setpoint − h</text>
  <text x="425" y="575" text-anchor="middle" class="label-sym">dacă e &gt; 0: I += Ki · e · Δt</text>
  <text x="425" y="595" text-anchor="middle" class="label-sub">acumulez "datoria" de apă a plantei</text>

  <line x1="425" y1="605" x2="425" y2="630" class="line" marker-end="url(#arrow)"/>

  <!-- ============================================
       5. Test histerezis
       ============================================ -->

  <polygon points="425,630 660,693 425,755 190,693" class="box-act"/>
  <text x="425" y="680" text-anchor="middle" class="label-sym">h &gt; setpoint − hist ?</text>
  <text x="425" y="698" text-anchor="middle" class="label-sub">solul încă are destulă apă</text>
  <text x="425" y="715" text-anchor="middle" class="label-sub">(nu am scăzut sub prag)</text>

  <!-- DA → STOP -->
  <line x1="660" y1="693" x2="730" y2="693" class="line-stop" marker-end="url(#arrow)"/>
  <text x="675" y="685" class="label-yes">DA</text>

  <rect x="730" y="665" width="110" height="55" rx="4" class="box-stop"/>
  <text x="785" y="687" text-anchor="middle" class="label">NU UDA</text>
  <text x="785" y="705" text-anchor="middle" class="label-sub">solul e ok</text>

  <!-- NU → în jos -->
  <line x1="425" y1="755" x2="425" y2="790" class="line" marker-end="url(#arrow)"/>
  <text x="440" y="773" class="label-no">NU</text>

  <!-- ============================================
       6. Test cadenţă biologică (T_min)
       ============================================ -->

  <polygon points="425,790 660,853 425,915 190,853" class="box-act"/>
  <text x="425" y="840" text-anchor="middle" class="label-sym">dt ≥ T_min ?</text>
  <text x="425" y="858" text-anchor="middle" class="label-sub">a trecut cadenţa biologică</text>
  <text x="425" y="875" text-anchor="middle" class="label-sub">specifică plantei</text>

  <!-- NU → STOP -->
  <line x1="190" y1="853" x2="120" y2="853" class="line-stop" marker-end="url(#arrow)"/>
  <text x="155" y="845" class="label-no">NU</text>

  <rect x="10" y="825" width="110" height="55" rx="4" class="box-stop"/>
  <text x="65" y="847" text-anchor="middle" class="label">NU UDA</text>
  <text x="65" y="865" text-anchor="middle" class="label-sub">aşteptăm cadenţa</text>

  <!-- DA → în jos -->
  <line x1="425" y1="915" x2="425" y2="950" class="line" marker-end="url(#arrow)"/>
  <text x="440" y="933" class="label-yes">DA</text>

  <!-- ============================================
       7. Calcul doză
       ============================================ -->

  <rect x="225" y="950" width="400" height="75" rx="4" class="box-act"/>
  <text x="425" y="971" text-anchor="middle" class="label-sym">doza = max( Kp·e + I,  target_dose_ml )</text>
  <text x="425" y="993" text-anchor="middle" class="label-sym">doza = clamp( doza, 5, 200 ) [ml]</text>
  <text x="425" y="1014" text-anchor="middle" class="label-sub">PI propune o cantitate, plantarea forţează un minim</text>

  <line x1="425" y1="1025" x2="425" y2="1060" class="line" marker-end="url(#arrow)"/>

  <!-- ============================================
       8. Udare + reset integral
       ============================================ -->

  <rect x="275" y="1060" width="300" height="75" rx="4" class="box-uda"/>
  <text x="425" y="1083" text-anchor="middle" class="label" font-weight="bold">UDARE</text>
  <text x="425" y="1103" text-anchor="middle" class="label-sym">pompă ON pentru (doza / debit) secunde</text>
  <text x="425" y="1122" text-anchor="middle" class="label-sym">I = 0  (reset anti-windup)</text>

  <line x1="425" y1="1135" x2="425" y2="1165" class="line" marker-end="url(#arrow)"/>

  <!-- ============================================
       END
       ============================================ -->

  <ellipse cx="425" cy="1185" rx="60" ry="20" class="box-act"/>
  <text x="425" y="1190" text-anchor="middle" class="label">END tick</text>

  <!-- ============================================
       Legendă
       ============================================ -->

  <rect x="20" y="1240" width="810" height="120" rx="4" fill="#fafafa" stroke="#ccc"/>
  <text x="30" y="1260" font-size="13" font-weight="bold">Legendă notaţii:</text>

  <text x="30" y="1282" class="label">h</text>
  <text x="55" y="1282" class="label-sub">= umiditate sol măsurată (%)</text>

  <text x="30" y="1302" class="label">e</text>
  <text x="55" y="1302" class="label-sub">= eroare = setpoint − h (%)</text>

  <text x="30" y="1322" class="label">I</text>
  <text x="55" y="1322" class="label-sub">= acumulator integral (ml)</text>

  <text x="30" y="1342" class="label">dt</text>
  <text x="55" y="1342" class="label-sub">= timp scurs de la ultima udare</text>

  <text x="290" y="1282" class="label">T_min</text>
  <text x="345" y="1282" class="label-sub">= cadenţa biologică (din clasa plantei)</text>

  <text x="290" y="1302" class="label">hist</text>
  <text x="345" y="1302" class="label-sub">= histerezis sub setpoint (5%)</text>

  <text x="290" y="1322" class="label">target_dose_ml</text>
  <text x="425" y="1322" class="label-sub">= doza ţintă per udare (din clasă)</text>

  <text x="290" y="1342" class="label">safety_max</text>
  <text x="385" y="1342" class="label-sub">= override de siguranţă (1.2 × T_min)</text>

  <text x="640" y="1282" class="label">Kp, Ki</text>
  <text x="685" y="1282" class="label-sub">= câştiguri PI (acordare IMC)</text>

  <text x="640" y="1302" class="label">Δt</text>
  <text x="685" y="1302" class="label-sub">= pas regulator (10 min)</text>

</svg>
