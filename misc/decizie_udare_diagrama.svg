<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 980"
     font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <style>
      .act   { fill:#fff; stroke:#000; stroke-width:1.6; }
      .dec   { fill:#f0f0f0; stroke:#000; stroke-width:1.6; }
      .stop  { fill:#fff; stroke:#000; stroke-width:1.4; stroke-dasharray:5 3; }
      .uda   { fill:#e2e2e2; stroke:#000; stroke-width:2; }
      .term  { fill:#e2e2e2; stroke:#000; stroke-width:1.6; }
      .t     { font-size:13.5px; fill:#000; }
      .tb    { font-size:14px; fill:#000; font-weight:700; }
      .sym   { font-size:13.5px; fill:#000; font-family:'Cambria Math','Times New Roman',serif; }
      .ts    { font-size:12px; fill:#000; }
      .yn    { font-size:12.5px; fill:#000; font-weight:700; }
      .ln    { stroke:#000; stroke-width:1.5; fill:none; }
      .lns   { stroke:#000; stroke-width:1.3; fill:none; stroke-dasharray:4 3; }
    </style>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="700">Schema de decizie pentru udarea automată</text>
  <text x="440" y="50" text-anchor="middle" class="ts">(executată la fiecare ciclu de reglare, la ~10 min)</text>

  <!-- START -->
  <ellipse cx="425" cy="92" rx="62" ry="20" class="term"/>
  <text x="425" y="97" text-anchor="middle" class="tb">ÎNCEPUT ciclu</text>
  <line x1="425" y1="112" x2="425" y2="134" class="ln" marker-end="url(#ar)"/>

  <!-- 1. citire -->
  <rect x="280" y="134" width="290" height="56" rx="4" class="act"/>
  <text x="425" y="156" text-anchor="middle" class="sym">h = citire senzor</text>
  <text x="425" y="176" text-anchor="middle" class="sym">dt = timp de la ultima udare</text>
  <line x1="425" y1="190" x2="425" y2="212" class="ln" marker-end="url(#ar)"/>

  <!-- 2. SAFETY  (centru y=244, semi-inaltime 32) -->
  <polygon points="425,212 665,244 425,276 185,244" class="dec"/>
  <text x="425" y="240" text-anchor="middle" class="sym">dt ≥ safety_max ?</text>
  <text x="425" y="257" text-anchor="middle" class="ts">au trecut prea multe zile fără udare</text>
  <line x1="425" y1="276" x2="425" y2="310" class="ln" marker-end="url(#ar)"/>
  <text x="438" y="296" class="yn">NU</text>
  <line x1="665" y1="244" x2="735" y2="244" class="ln" marker-end="url(#ar)"/>
  <text x="682" y="236" class="yn">DA</text>
  <rect x="735" y="215" width="125" height="58" rx="4" class="uda"/>
  <text x="797" y="239" text-anchor="middle" class="tb">UDARE FORŢATĂ</text>
  <text x="797" y="258" text-anchor="middle" class="ts">cu doza ţintă</text>

  <!-- 3. ANTI-TWITCH  (centru y=342) -->
  <polygon points="425,310 665,342 425,374 185,342" class="dec"/>
  <text x="425" y="338" text-anchor="middle" class="sym">dt &lt; 6 h ?</text>
  <text x="425" y="355" text-anchor="middle" class="ts">am udat foarte recent (anti-oscilaţie)</text>
  <line x1="665" y1="342" x2="735" y2="342" class="lns" marker-end="url(#ar)"/>
  <text x="682" y="334" class="yn">DA</text>
  <rect x="735" y="315" width="125" height="54" rx="4" class="stop"/>
  <text x="797" y="339" text-anchor="middle" class="tb">NU UDA</text>
  <text x="797" y="357" text-anchor="middle" class="ts">pauză activă</text>
  <line x1="425" y1="374" x2="425" y2="408" class="ln" marker-end="url(#ar)"/>
  <text x="438" y="394" class="yn">NU</text>

  <!-- 4. INTEGRALA -->
  <rect x="275" y="408" width="300" height="70" rx="4" class="act"/>
  <text x="425" y="430" text-anchor="middle" class="sym">e = setpoint − h</text>
  <text x="425" y="450" text-anchor="middle" class="sym">dacă e &gt; 0:  I += K_i · e · Δt</text>
  <text x="425" y="469" text-anchor="middle" class="ts">acumulează „datoria de apă” a plantei</text>
  <line x1="425" y1="478" x2="425" y2="500" class="ln" marker-end="url(#ar)"/>

  <!-- 5. HISTEREZIS  (centru y=532) -->
  <polygon points="425,500 665,532 425,564 185,532" class="dec"/>
  <text x="425" y="528" text-anchor="middle" class="sym">h &gt; setpoint − hist ?</text>
  <text x="425" y="545" text-anchor="middle" class="ts">solul încă are destulă apă</text>
  <line x1="665" y1="532" x2="735" y2="532" class="lns" marker-end="url(#ar)"/>
  <text x="682" y="524" class="yn">DA</text>
  <rect x="735" y="505" width="125" height="54" rx="4" class="stop"/>
  <text x="797" y="529" text-anchor="middle" class="tb">NU UDA</text>
  <text x="797" y="547" text-anchor="middle" class="ts">solul e ok</text>
  <line x1="425" y1="564" x2="425" y2="598" class="ln" marker-end="url(#ar)"/>
  <text x="438" y="584" class="yn">NU</text>

  <!-- 6. CADENTA  (centru y=630) -->
  <polygon points="425,598 665,630 425,662 185,630" class="dec"/>
  <text x="425" y="626" text-anchor="middle" class="sym">dt ≥ T_min ?</text>
  <text x="425" y="643" text-anchor="middle" class="ts">a trecut cadenţa biologică a plantei</text>
  <line x1="185" y1="630" x2="115" y2="630" class="lns" marker-end="url(#ar)"/>
  <text x="142" y="622" class="yn">NU</text>
  <rect x="0" y="603" width="115" height="54" rx="4" class="stop"/>
  <text x="57" y="627" text-anchor="middle" class="tb">NU UDA</text>
  <text x="57" y="645" text-anchor="middle" class="ts">aşteaptă cadenţa</text>
  <line x1="425" y1="662" x2="425" y2="696" class="ln" marker-end="url(#ar)"/>
  <text x="438" y="682" class="yn">DA</text>

  <!-- 7. CALCUL DOZA -->
  <rect x="215" y="696" width="420" height="74" rx="4" class="act"/>
  <text x="425" y="718" text-anchor="middle" class="sym">doza = max( K_p · e + I ,  doza ţintă )</text>
  <text x="425" y="739" text-anchor="middle" class="sym">doza = clamp( doza, 5, 200 )  [ml]</text>
  <text x="425" y="759" text-anchor="middle" class="ts">PI propune cantitatea, clasa de plantă impune un minim</text>
  <line x1="425" y1="770" x2="425" y2="804" class="ln" marker-end="url(#ar)"/>

  <!-- 8. UDARE + reset -->
  <rect x="270" y="804" width="310" height="72" rx="4" class="uda"/>
  <text x="425" y="826" text-anchor="middle" class="tb">UDARE</text>
  <text x="425" y="846" text-anchor="middle" class="sym">pompă ON timp de (doza / debit) s</text>
  <text x="425" y="865" text-anchor="middle" class="sym">I = 0  (resetare anti-windup)</text>
  <line x1="425" y1="876" x2="425" y2="906" class="ln" marker-end="url(#ar)"/>

  <!-- END -->
  <ellipse cx="425" cy="928" rx="62" ry="20" class="term"/>
  <text x="425" y="933" text-anchor="middle" class="tb">SFÂRŞIT ciclu</text>
</svg>
