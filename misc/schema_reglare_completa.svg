<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 900"
     font-family="serif" font-size="14">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
    <style>
      .box    { fill: #ffffff; stroke: #000; stroke-width: 1.5; }
      .src    { fill: #eef3ee; stroke: #2e7d4a; stroke-width: 1.5; }
      .calc   { fill: #f3f0e8; stroke: #8a6d2b; stroke-width: 1.5; }
      .proc   { fill: #eaeef5; stroke: #2b5a8a; stroke-width: 1.5; }
      .gate   { fill: #fbf0f0; stroke: #a0392b; stroke-width: 1.4; }
      .ln     { stroke: #000; stroke-width: 1.4; fill: none; }
      .fb     { stroke: #2b5a8a; stroke-width: 1.4; fill: none; }
      .lbl    { font-size: 13px; }
      .sub    { font-size: 11px; fill: #555; }
      .sym    { font-size: 12.5px; font-family: monospace; }
      .sec    { font-size: 15px; font-weight: bold; }
      .tag    { font-size: 11px; fill: #333; }
    </style>
  </defs>

  <text x="440" y="26" text-anchor="middle" font-size="17" font-weight="bold">
    Reglarea automată a umidităţii solului (regulator PI acordat prin IMC)
  </text>

  <!-- ============================================================
       A. ACORDARE OFFLINE  (la configurarea nodului, pe dashboard)
       ============================================================ -->
  <text x="30" y="56" class="sec">A. Acordarea regulatorului (offline, la configurare)</text>

  <!-- SOL -->
  <rect x="30" y="70" width="205" height="92" rx="4" class="src"/>
  <text x="132" y="90" text-anchor="middle" class="lbl" font-weight="bold">Tip SOL → modelul procesului</text>
  <text x="132" y="110" text-anchor="middle" class="sub">retenţie: scăzut / mediu / ridicat</text>
  <text x="132" y="128" text-anchor="middle" class="sym">K = 1.5 %/ml</text>
  <text x="132" y="146" text-anchor="middle" class="sym">τ = 31.7h × (0.55 / 1.0 / 1.70)</text>

  <!-- PLANTA -->
  <rect x="30" y="172" width="205" height="110" rx="4" class="src"/>
  <text x="132" y="192" text-anchor="middle" class="lbl" font-weight="bold">Tip PLANTĂ → ţinte</text>
  <text x="132" y="211" text-anchor="middle" class="sub">necesar apă → setpoint r</text>
  <text x="132" y="228" text-anchor="middle" class="sym">r = 35 / 50 / 65 %</text>
  <text x="132" y="247" text-anchor="middle" class="sub">clasă udare → λ, T_min, doză</text>
  <text x="132" y="266" text-anchor="middle" class="sym">λ = 24 … 672 h</text>

  <!-- ACORDARE IMC -->
  <rect x="300" y="92" width="245" height="118" rx="4" class="calc"/>
  <text x="422" y="113" text-anchor="middle" class="lbl" font-weight="bold">Acordare IMC (proces ordin 1)</text>
  <text x="422" y="138" text-anchor="middle" class="sym">Kp = τ / (K · λ)</text>
  <text x="422" y="160" text-anchor="middle" class="sym">Ki = Kp / τ</text>
  <text x="422" y="184" text-anchor="middle" class="sub">histerezis = 5%  (prag = r − 5)</text>
  <text x="422" y="200" text-anchor="middle" class="sub">safety_max = 1.2 × T_min</text>

  <!-- PARAMETRI in EEPROM -->
  <rect x="615" y="104" width="235" height="96" rx="4" class="calc"/>
  <text x="732" y="125" text-anchor="middle" class="lbl" font-weight="bold">Parametri salvaţi (EEPROM)</text>
  <text x="732" y="146" text-anchor="middle" class="sym">Kp, Ki, r, hist</text>
  <text x="732" y="166" text-anchor="middle" class="sym">T_min, target_dose</text>
  <text x="732" y="186" text-anchor="middle" class="sub">per nod, indexat după nume</text>

  <line x1="235" y1="116" x2="300" y2="130" class="ln" marker-end="url(#arrow)"/>
  <line x1="235" y1="226" x2="300" y2="180" class="ln" marker-end="url(#arrow)"/>
  <line x1="545" y1="152" x2="615" y2="152" class="ln" marker-end="url(#arrow)"/>
  <line x1="732" y1="200" x2="732" y2="358" class="ln" marker-end="url(#arrow)"/>
  <text x="740" y="280" class="tag">parametrizează</text>
  <text x="740" y="295" class="tag">bucla PI →</text>

  <line x1="20" y1="320" x2="860" y2="320" stroke="#bbb" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- ============================================================
       B. BUCLA DE REGLARE  (pe hub, tick la 10 min — REG_TICK_MS)
       ============================================================ -->
  <text x="30" y="350" class="sec">B. Bucla de reglare pe hub — tick la fiecare 10 min (Δt)</text>

  <!-- r setpoint -->
  <text x="28" y="422" class="lbl">r</text>
  <text x="20" y="438" class="sub">setpoint</text>
  <line x1="46" y1="426" x2="108" y2="426" class="ln" marker-end="url(#arrow)"/>

  <!-- Sumator -->
  <circle cx="126" cy="426" r="17" class="box"/>
  <text x="126" y="432" text-anchor="middle" font-size="18">Σ</text>
  <text x="107" y="420" font-size="13">+</text>
  <text x="128" y="462" font-size="13">−</text>

  <!-- e -->
  <line x1="143" y1="426" x2="225" y2="426" class="ln" marker-end="url(#arrow)"/>
  <text x="184" y="417" text-anchor="middle" class="sub">e = r − h</text>

  <!-- PI -->
  <rect x="225" y="392" width="185" height="70" rx="4" class="box"/>
  <text x="317" y="412" text-anchor="middle" class="lbl" font-weight="bold">Regulator PI</text>
  <text x="317" y="432" text-anchor="middle" class="sym">dacă e&gt;0: I += Ki·e·Δt</text>
  <text x="317" y="450" text-anchor="middle" class="sym">u = Kp·e + I</text>

  <!-- u -->
  <line x1="410" y1="426" x2="492" y2="426" class="ln" marker-end="url(#arrow)"/>
  <text x="451" y="417" text-anchor="middle" class="sub">u = doză [ml]</text>

  <!-- Pompa + valva (actuator: ml -> timp) -->
  <rect x="492" y="392" width="158" height="70" rx="4" class="proc"/>
  <text x="571" y="412" text-anchor="middle" class="lbl" font-weight="bold">Pompă + valvă</text>
  <text x="571" y="432" text-anchor="middle" class="sym">t_pompă = u / Q</text>
  <text x="571" y="450" text-anchor="middle" class="sub">Q = debit calibrat [ml/s]</text>

  <!-- apa -->
  <line x1="650" y1="426" x2="700" y2="426" class="ln" marker-end="url(#arrow)"/>
  <text x="675" y="417" text-anchor="middle" class="sub">apă</text>

  <!-- Proces sol -->
  <rect x="700" y="392" width="140" height="70" rx="4" class="proc"/>
  <text x="770" y="412" text-anchor="middle" class="lbl" font-weight="bold">Proces sol</text>
  <text x="770" y="432" text-anchor="middle" class="sym">ordin 1: K, τ</text>
  <text x="770" y="450" text-anchor="middle" class="sub">plantă în ghiveci</text>

  <!-- nod bifurcatie y -->
  <circle cx="800" cy="500" r="3" fill="#000"/>
  <line x1="770" y1="462" x2="770" y2="500" class="ln"/>
  <line x1="770" y1="500" x2="800" y2="500" class="ln"/>
  <text x="808" y="486" class="sub">y = umiditate reală</text>

  <!-- FEEDBACK 1: senzor -> h -> sumator -->
  <line x1="800" y1="500" x2="800" y2="540" class="fb"/>
  <line x1="800" y1="540" x2="470" y2="540" class="fb" marker-end="url(#arrow)"/>
  <rect x="350" y="515" width="120" height="50" rx="4" class="box"/>
  <text x="410" y="537" text-anchor="middle" class="lbl">Senzor sol</text>
  <text x="410" y="554" text-anchor="middle" class="sub">rezistiv → ESP-NOW</text>
  <line x1="350" y1="540" x2="126" y2="540" class="fb"/>
  <line x1="126" y1="540" x2="126" y2="443" class="fb" marker-end="url(#arrow)"/>
  <text x="138" y="520" class="sub">h (măsurat)</text>

  <!-- ============================================================
       C. LOGICA TICK (gating) — decizia de a uda, exact ca firmware
       ============================================================ -->
  <text x="30" y="610" class="sec">C. Logica unui tick de regulator (decizia de udare)</text>

  <!-- caseta gating -->
  <rect x="30" y="622" width="500" height="150" rx="4" class="gate"/>
  <text x="48" y="644" class="sym">1.  dt ≥ safety_max  ──────────────►  UDARE FORŢATĂ (target_dose)</text>
  <text x="48" y="666" class="sym">2.  dt &lt; 6h (anti-twitch) ─────────►  NU UDA (cooldown)</text>
  <text x="48" y="688" class="sym">3.  e = r − h ;  dacă e&gt;0:  I += Ki·e·Δt   (acumulare)</text>
  <text x="48" y="710" class="sym">4.  h &gt; r − hist  ──────────────────►  NU UDA (sol ok)</text>
  <text x="48" y="732" class="sym">5.  dt &lt; T_min  ────────────────────►  NU UDA (aşteaptă cadenţa)</text>
  <text x="48" y="756" class="sym">6.  altfel: udă cu clamp(max(Kp·e+I, target), 5, 200) ;  I = 0</text>

  <!-- dt: feedback al timpului de la ultima udare (din statistici) -->
  <rect x="560" y="640" width="280" height="62" rx="4" class="box"/>
  <text x="700" y="661" text-anchor="middle" class="lbl" font-weight="bold">Statistici udare (EEPROM)</text>
  <text x="700" y="681" text-anchor="middle" class="sym">lastWatering → dt</text>
  <text x="700" y="697" text-anchor="middle" class="sub">actualizat după fiecare udare (RTC)</text>

  <!-- udarea actualizeaza statisticile (sageata jos) -->
  <line x1="571" y1="462" x2="571" y2="620" class="ln" stroke-dasharray="3 3"/>
  <line x1="571" y1="620" x2="700" y2="620" class="ln" stroke-dasharray="3 3"/>
  <line x1="700" y1="620" x2="700" y2="640" class="ln" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="578" y="600" class="tag">udare → înregistrează</text>

  <!-- dt alimenteaza gating-ul -->
  <line x1="560" y1="685" x2="532" y2="685" class="ln" marker-end="url(#arrow)"/>
  <text x="445" y="612" class="tag">dt = timp de la ultima udare</text>

  <!-- Legenda -->
  <rect x="20" y="792" width="840" height="96" rx="4" fill="#fafafa" stroke="#ccc"/>
  <text x="30" y="812" font-size="12" font-weight="bold">Legendă:</text>
  <text x="30" y="831" class="sub">r = setpoint [%] · h = umiditate măsurată [%] · e = eroare = r − h · u = doză [ml] · I = acumulator integral [ml] · dt = timp de la ultima udare</text>
  <text x="30" y="849" class="sub">K, τ = parametrii modelului de sol (ordin 1, din identificare experimentală) · λ = constantă de timp dorită în buclă închisă (din clasa plantei)</text>
  <text x="30" y="867" class="sub">Kp = τ/(K·λ), Ki = Kp/τ (acordare IMC) · hist = histerezis 5% · T_min = cadenţa minimă · safety_max = 1.2·T_min · Q = debitul pompei · Δt = 10 min</text>
  <text x="30" y="883" class="sub" font-style="italic">Bucla are dublu feedback: umiditatea h (corecţie continuă a erorii) şi timpul dt (respectarea cadenţei biologice şi a siguranţei).</text>

</svg>
