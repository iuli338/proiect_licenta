  <!-- ===== UDARE #1 : 25 ml, ziua 3.4 ===== -->
  <line class="udl" x1="350.2" y1="70" x2="350.2" y2="430"/>
  <circle cx="350.2" cy="412.5" r="4" fill="#000"/>
  <circle cx="352.8" cy="70" r="4" fill="#000"/>
  <line x1="350.2" y1="406" x2="350.2" y2="78" class="ax" marker-end="url(#ar)"/>
  <rect x="240" y="98" width="146" height="50" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <text x="313" y="117" text-anchor="middle" class="tb">Udare #1</text>
  <text x="313" y="134" text-anchor="middle" class="sym">25 ml → K ≈ 3.5 %/ml</text>

  <!-- ===== UDARE #2 : 75 ml, ziua 7.4 ===== -->
  <line class="udl" x1="654.6" y1="70" x2="654.6" y2="430"/>
  <circle cx="654.1" cy="360.7" r="4" fill="#000"/>
  <circle cx="657.3" cy="70" r="4" fill="#000"/>
  <line x1="654.6" y1="354" x2="654.6" y2="78" class="ax" marker-end="url(#ar)"/>
  <rect x="547" y="120" width="146" height="50" rx="4" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <text x="620" y="139" text-anchor="middle" class="tb">Udare #2</text>
  <text x="620" y="156" text-anchor="middle" class="sym">75 ml → K ≈ 1.1 %/ml</text>

  <!-- eticheta scurta: uscarea de ordinul 1 intre udari (in banda libera de sus) -->
  <text x="480" y="206" text-anchor="middle" class="ts">uscare exponenţială (ordinul 1, τ ≈ 32 h)</text>
  <line class="udl" x1="470" y1="214" x2="455" y2="300" stroke-dasharray="3 2"/>

  <!-- ===== NOTA ===== -->
  <rect x="40" y="496" width="840" height="126" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
  <text x="52" y="518" class="tb" font-size="13">Ce arată experimentul</text>
  <text x="52" y="540" class="ts">• La fiecare udare apa acoperă electrozii şi senzorul saturează la 100%, indiferent de volum; în câteva minute apa pătrunde în sol şi citirea iese din saturaţie.</text>
  <text x="52" y="560" class="ts">• Între udări, umiditatea scade exponenţial spre echilibru — un proces de ordinul 1, din care se identifică constanta de timp τ ≈ 32 h.</text>
  <text x="52" y="580" class="ts">• Efectul volumului se vede în coadă, nu în vârf: 75 ml ţin solul umed mult mai mult decât 25 ml.</text>
  <text x="52" y="600" class="ts">• Câştigul K (Δumiditate / volum) diferă (≈3.5 vs ≈1.1 %/ml): udarea #1 pe sol uscat (absoarbe lacom), #2 pe sol care avea deja apă — proces neliniar.</text>
</svg>
