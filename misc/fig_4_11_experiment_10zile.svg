<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640"
     font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <style>
      .ax    { stroke:#000; stroke-width:1.6; fill:none; }
      .grid  { stroke:#d0d0d0; stroke-width:1; fill:none; }
      .curve { stroke:#000; stroke-width:1.8; fill:none; }
      .udl   { stroke:#000; stroke-width:1.4; fill:none; stroke-dasharray:5 3; }
      .satl  { stroke:#777; stroke-width:1.2; fill:none; stroke-dasharray:2 3; }
      .tk    { font-size:12px; fill:#000; }
      .axt   { font-size:13px; fill:#000; }
      .t     { font-size:13px; fill:#000; }
      .tb    { font-size:14px; fill:#000; font-weight:700; }
      .ts    { font-size:12px; fill:#000; }
      .sym   { font-size:13px; fill:#000; font-family:'Cambria Math','Times New Roman',serif; }
    </style>
  </defs>

  <text x="460" y="30" text-anchor="middle" font-size="17" font-weight="700">Experiment de identificare — umiditatea solului pe 10 zile</text>
  <text x="460" y="50" text-anchor="middle" class="ts">monitorizare continuă (eşantion la ~10 min) cu două udări controlate</text>

  <!-- ===== GRID ===== -->
