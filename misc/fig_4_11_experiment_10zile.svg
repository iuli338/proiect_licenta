  <line class="grid" x1="698" y1="70" x2="698" y2="430"/>
  <line class="grid" x1="774" y1="70" x2="774" y2="430"/>

  <!-- linia de saturatie a senzorului (100%) -->
  <line class="satl" x1="90" y1="70" x2="850" y2="70"/>

  <!-- ===== AXE ===== -->
  <line class="ax" x1="90" y1="70" x2="90" y2="430"/>
  <line class="ax" x1="90" y1="430" x2="850" y2="430"/>

  <text x="82" y="74"  text-anchor="end" class="tk">100</text>
  <text x="82" y="146" text-anchor="end" class="tk">80</text>
  <text x="82" y="218" text-anchor="end" class="tk">60</text>
  <text x="82" y="290" text-anchor="end" class="tk">40</text>
  <text x="82" y="362" text-anchor="end" class="tk">20</text>
  <text x="82" y="434" text-anchor="end" class="tk">0</text>
  <text x="90"  y="448" text-anchor="middle" class="tk">0</text>
  <text x="166" y="448" text-anchor="middle" class="tk">1</text>
  <text x="242" y="448" text-anchor="middle" class="tk">2</text>
  <text x="318" y="448" text-anchor="middle" class="tk">3</text>
  <text x="394" y="448" text-anchor="middle" class="tk">4</text>
  <text x="470" y="448" text-anchor="middle" class="tk">5</text>
  <text x="546" y="448" text-anchor="middle" class="tk">6</text>
  <text x="622" y="448" text-anchor="middle" class="tk">7</text>
  <text x="698" y="448" text-anchor="middle" class="tk">8</text>
  <text x="774" y="448" text-anchor="middle" class="tk">9</text>
  <text x="850" y="448" text-anchor="middle" class="tk">10</text>

  <text x="470" y="472" text-anchor="middle" class="axt">timp [zile]</text>
  <text x="28" y="250" text-anchor="middle" class="axt" transform="rotate(-90 28 250)">umiditate sol [%]</text>

  <!-- eticheta linie saturatie -->
  <text x="846" y="64" text-anchor="end" class="ts">saturaţie senzor (100%)</text>

